<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Member Directory</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .card {
            margin-top: 20px;
            border-radius: 10px;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f1f1;
        }

        .logout-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
            <h3>Member Directory</h3>
        </div>
        <div class="card-body">

            <!-- Display user information -->
            <div class="mb-4">
                <p>
                    <strong>User:</strong> <span sec:authentication="principal.username"></span><br>
                    <strong>Role(s):</strong> <span sec:authentication="principal.authorities"></span>
                </p>
            </div>

            <!-- Manager and Admin-specific sections -->
            <div class="mb-4">
                <div sec:authorize="hasRole('MANAGER')" class="mb-3">
                    <a th:href="@{/members/leaders}" class="btn btn-secondary btn-sm">Leadership Meeting</a>
                    <span class="text-muted">(Only for Manager peeps)</span>
                </div>
                <div sec:authorize="hasRole('ADMIN')" class="mb-3">
                    <a th:href="@{/members/systems}" class="btn btn-secondary btn-sm">Systems Meeting</a>
                    <span class="text-muted">(Only for Admin peeps)</span>
                </div>
            </div>

            <!-- Add Member button -->
            <div sec:authorize="hasRole('MANAGER')" class="mb-4">
                <a th:href="@{/members/showFormForAdd}" class="btn btn-success btn-sm">Add Member</a>
            </div>

            <!-- Member Table -->
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Photo</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th sec:authorize="hasRole('MANAGER') or hasRole('ADMIN')">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tempMember : ${members}">
                        <td>
                            <input type="submit" value="Upload" class="btn btn-outline-primary btn-sm"/>
                        </td>
                        <td th:text="${tempMember.firstName}"></td>
                        <td th:text="${tempMember.lastName}"></td>
                        <td th:text="${tempMember.email}"></td>
                        <td sec:authorize="hasRole('MANAGER') or hasRole('ADMIN')">
                            <div class="d-flex gap-2">
                                <!-- Update button for MANAGER -->
                                <div sec:authorize="hasRole('MANAGER')">
                                    <a th:href="@{/members/showFormForUpdate(memberId=${tempMember.id})}"
                                       class="btn btn-info btn-sm">Update</a>
                                </div>
                                <!-- Delete button for ADMIN -->
                                <div sec:authorize="hasRole('ADMIN')">
                                    <a th:href="@{/members/delete(memberId=${tempMember.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this member?')">Delete</a>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Logout Button -->
            <form th:action="@{/logout}" method="POST" class="logout-btn">
                <button type="submit" class="btn btn-warning btn-sm">Logout</button>
            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-pnNbT3RukUSF2zBfcoc7wKcBRh4sXGcdzD6gCMa8ACRY6IWvZrksOVsGx6+zS3l3"
        crossorigin="anonymous"></script>
</body>
</html>
