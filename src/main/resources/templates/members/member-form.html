<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>Save Member</title>
</head>

<body>

<div class="container">

    <h3>Member Directory</h3>
    <hr>
    <p class="h4 mb-4">Save Member</p>
    <form action="#" th:action="@{/members/save}" th:object="${member}" method="POST" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="text" th:field="*{firstName}" class="form-control mb-4 w-25" placeholder="First name">
        <input type="text" th:field="*{lastName}" class="form-control mb-4 w-25" placeholder="Last name">
        <input type="text" th:field="*{email}" class="form-control mb-4 w-25" placeholder="Email">
        <label for="photo">Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*" class="form-control mb-4 w-25">
        <button type="submit" class="btn btn-info col-2">Save</button>
    </form>


    <hr>
    <a th:href="@{/members/list}">Back to Members List</a>

</div>

</body>

</html>
